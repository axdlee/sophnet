model: Kimi-K3
label:
  zh_Hans: Kimi-K3
  en_US: Kimi-K3
model_type: llm
features:
  - tool-call
  - stream-tool-call
  - vision
  - structured-output
  - agent-thought
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 48000
    default: 8192
  - name: temperature
    use_template: temperature
    default: 0.6
  - name: top_p
    use_template: top_p
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
pricing:
  input: '20'
  output: '100'
  unit: '0.000001'
  currency: RMB
