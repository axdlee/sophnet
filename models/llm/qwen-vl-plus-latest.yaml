model: qwen-vl-plus-latest
label:
  zh_Hans: qwen-vl-plus-latest (兼容)
  en_US: qwen-vl-plus-latest (Legacy)
model_type: llm
features:
  - tool-call
  - stream-tool-call
  - vision
  - video
  - structured-output
  - agent-thought
model_properties:
  mode: chat
  context_size: 254000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 48000
    default: 8192
  - name: temperature
    use_template: temperature
    default: 0.6
  - name: top_p
    use_template: top_p
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
pricing:
  input: '3'
  output: '30'
  unit: '0.000001'
  currency: RMB
