model: qwen3.7-max
label:
  zh_Hans: qwen3.7-max
  en_US: qwen3.7-max
model_type: llm
features:
  - tool-call
  - stream-tool-call
  - agent-thought
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 48000
    default: 8192
  - name: temperature
    use_template: temperature
    default: 0.6
  - name: top_p
    use_template: top_p
pricing:
  input: '6'
  output: '18'
  unit: '0.000001'
  currency: RMB
