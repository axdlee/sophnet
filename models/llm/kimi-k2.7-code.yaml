model: Kimi-K2.7-Code
label:
  zh_Hans: Kimi-K2.7-Code
  en_US: Kimi-K2.7-Code
model_type: llm
features:
  - tool-call
  - stream-tool-call
  - vision
  - video
  - agent-thought
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 48000
    default: 8192
  - name: temperature
    use_template: temperature
    default: 0.6
  - name: top_p
    use_template: top_p
pricing:
  input: '6.5'
  output: '27'
  unit: '0.000001'
  currency: RMB
