model: doubao-seed-2-0-mini-260428
label:
  zh_Hans: doubao-seed-2-0-mini-260428
  en_US: doubao-seed-2-0-mini-260428
model_type: llm
features:
  - tool-call
  - stream-tool-call
  - vision
  - video
  - audio
  - structured-output
  - agent-thought
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    min: 1
    max: 48000
    default: 8192
  - name: temperature
    use_template: temperature
    default: 0.6
  - name: top_p
    use_template: top_p
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
pricing:
  input: '0.8'
  output: '8'
  unit: '0.000001'
  currency: RMB
