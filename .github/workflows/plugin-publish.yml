name: Publish plugin package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Read manifest metadata
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          name=$(awk '/^name:/{print $2; exit}' manifest.yaml)
          version=$(awk '/^version:/{print $2; exit}' manifest.yaml)
          author=$(awk '/^author:/{print $2; exit}' manifest.yaml)
          test -n "$name" && test -n "$version" && test -n "$author"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"

      - name: Download Dify plugin CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/dify-plugin" \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.5/dify-plugin-linux-amd64"
          chmod +x "$RUNNER_TEMP/dify-plugin"

      - name: Package plugin
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.manifest.outputs.name }}-${{ steps.manifest.outputs.version }}.difypkg"
          "$RUNNER_TEMP/dify-plugin" plugin package . -o "$package"
          test -s "$package"
          echo "name=$package" >> "$GITHUB_OUTPUT"

      - name: Checkout Marketplace fork
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.manifest.outputs.author }}/dify-plugins
          path: dify-plugins
          token: ${{ secrets.PLUGIN_ACTION }}
          fetch-depth: 0

      - name: Publish package branch
        id: branch
        shell: bash
        working-directory: dify-plugins
        run: |
          set -euo pipefail
          plugin="${{ steps.manifest.outputs.name }}"
          version="${{ steps.manifest.outputs.version }}"
          author="${{ steps.manifest.outputs.author }}"
          package="${{ steps.package.outputs.name }}"
          branch="bump-${plugin}-plugin-${version}"
          target="${author}/${plugin}/${package}"

          git switch --create "$branch" origin/main
          test ! -e "$target"
          install -D "../$package" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git commit -m "bump ${plugin} plugin to version ${version}"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create Marketplace pull request
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --repo langgenius/dify-plugins \
            --head "${{ steps.manifest.outputs.author }}:${{ steps.branch.outputs.name }}" \
            --base main \
            --title "bump ${{ steps.manifest.outputs.name }} plugin to version ${{ steps.manifest.outputs.version }}" \
            --body-file - <<'EOF'
          # Plugin Submission

          ## Plugin information

          - **Author**: `${{ steps.manifest.outputs.author }}`
          - **Plugin name**: `${{ steps.manifest.outputs.name }}`
          - **Version**: `${{ steps.manifest.outputs.version }}`
          - **Source repository**: https://github.com/axdlee/sophnet
          - **Contact**: https://github.com/axdlee/sophnet/issues

          ## Submission type

          - [ ] New plugin
          - [x] Version update

          ## What changed

          Update the SophNet model provider package to version `${{ steps.manifest.outputs.version }}`.
          See the source release and commit history for the model and compatibility changes included in this version.

          ## Risk level

          - [ ] Low risk
          - [x] Medium risk
          - [ ] High risk

          The plugin sends user-provided model input to the fixed SophNet HTTPS API to perform inference.

          ## Required checks

          - [x] I have read and followed the [Marketplace submission requirements](https://github.com/langgenius/dify-plugins/blob/main/docs/plugin-submission-requirements.md).
          - [x] I have read and comply with the Plugin Developer Agreement.
          - [ ] I tested this plugin on Dify Community Edition and Dify Cloud, or documented any limitation below.
          - [x] The package contains only files needed at runtime.
          - [x] The package does not contain secrets, local credentials, `.env` files, `.git` directories, virtual environments, caches, logs, or IDE files.
          - [x] The package does not contain executables or bundled binaries, or I explained why they are required below.
          - [x] The plugin README includes setup steps, usage instructions, required APIs or credentials, connection requirements, and the source repository link.
          - [x] The plugin includes `PRIVACY.md` or a hosted privacy policy, and `manifest.yaml` references it.
          - [x] All user-facing text is primarily in English, with any localized README files following the [i18n guidance](https://docs.dify.ai/en/develop-plugin/features-and-specs/plugin-types/multilingual-readme).

          ## Security and privacy notes

          - Sends prompts, model parameters, embedding text, speech, and supported multimodal input to SophNet over HTTPS.
          - Uses fixed SophNet API endpoints; it does not execute code or commands, access SQL/SSH/SFTP, operate on the filesystem, automate browsers, or proxy arbitrary URLs.
          - Credentials are sent only in authorization headers and are not persisted or included in plugin error messages.
          - See `PRIVACY.md` for the complete data-processing disclosure.

          ## Local validation

          The package is built with Dify plugin daemon CLI `0.6.5`. Add the release-specific test commands and Dify runtime results before requesting review.

          ## Reviewer notes

          Dify Community Edition and Dify Cloud validation status must be confirmed manually before review.
          EOF
