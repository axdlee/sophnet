name: Publish plugin package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4

      - name: Read manifest metadata
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          name=$(awk '/^name:/{print $2; exit}' manifest.yaml)
          version=$(awk '/^version:/{print $2; exit}' manifest.yaml)
          author=$(awk '/^author:/{print $2; exit}' manifest.yaml)
          test -n "$name" && test -n "$version" && test -n "$author"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"

      - name: Download Dify plugin CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/dify-plugin" \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.5/dify-plugin-linux-amd64"
          chmod +x "$RUNNER_TEMP/dify-plugin"

      - name: Package plugin
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.manifest.outputs.name }}-${{ steps.manifest.outputs.version }}.difypkg"
          "$RUNNER_TEMP/dify-plugin" plugin package . -o "$package"
          test -s "$package"
          echo "name=$package" >> "$GITHUB_OUTPUT"

      - name: Checkout Marketplace fork
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.manifest.outputs.author }}/dify-plugins
          path: dify-plugins
          token: ${{ secrets.PLUGIN_ACTION }}
          fetch-depth: 0

      - name: Publish package branch
        id: branch
        shell: bash
        working-directory: dify-plugins
        run: |
          set -euo pipefail
          plugin="${{ steps.manifest.outputs.name }}"
          version="${{ steps.manifest.outputs.version }}"
          author="${{ steps.manifest.outputs.author }}"
          package="${{ steps.package.outputs.name }}"
          branch="bump-${plugin}-plugin-${version}"
          target="${author}/${plugin}/${package}"

          git switch --create "$branch" origin/main
          test ! -e "$target"
          install -D "../$package" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git commit -m "bump ${plugin} plugin to version ${version}"
          git push --set-upstream origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create Marketplace pull request
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --repo langgenius/dify-plugins \
            --head "${{ steps.manifest.outputs.author }}:${{ steps.branch.outputs.name }}" \
            --base main \
            --title "bump ${{ steps.manifest.outputs.name }} plugin to version ${{ steps.manifest.outputs.version }}" \
            --body-file - <<'EOF'
          ## Summary

          Upgrade the SophNet model provider plugin with current SophNet models and Dify Plugin SDK compatibility.

          ## Change Type

          - [x] LLM plugin

          ## Version

          - [x] Bumped top-level `version` in `manifest.yaml`
          - [x] Declared and locked the supported `dify_plugin` SDK version

          ## Testing

          - [x] Local deployment - Dify 1.16
          EOF
