[project]
name = "sophnet-dify-plugin"
version = "0.0.7"
description = "SophNet model provider plugin for Dify"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dify_plugin>=0.10.0,<0.11.0",
    "requests>=2.32.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.14.14,<0.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
